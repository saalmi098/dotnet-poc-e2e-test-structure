# Starts the complete ShopDemo stack: PostgreSQL + the ASP.NET Core API serving the Blazor client.
#
#   docker compose up --build        # http://localhost:5178
#   docker compose down -v           # stop and delete the database volume
#
# Demo accounts (password 1234): demo@test.com (shopper), admin@test.com (store manager), jane@test.com (shopper)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopdemo
      POSTGRES_USER: shopdemo
      POSTGRES_PASSWORD: shopdemo
    ports:
      - "${SHOPDEMO_DB_PORT:-5432}:5432"
    volumes:
      - shopdemo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopdemo -d shopdemo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__ShopDb: "Host=db;Port=5432;Database=shopdemo;Username=shopdemo;Password=shopdemo"
      # POST /api/test/reset restores the seed data; set to false for anything that is not a test target.
      Testing__EnableResetEndpoint: "true"
    ports:
      - "${SHOPDEMO_PORT:-5178}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\r\n\r\n\" >&3 && grep -q ok <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  shopdemo-db:
